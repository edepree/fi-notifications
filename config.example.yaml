fi:
  email: me@example.com
  password_file: /run/secrets/fi-notifications/fi-password   # Or `password:` inline

poll_interval: 300             # Seconds, >= 60
timezone: America/New_York     # IANA name used for windows and "last seen"
state_file: /data/state.json   # Optional, keeps rate-limit budget across restarts
health_port: 8080              # Optional

targets:
  phone:
    type: ntfy
    url: https://ntfy.example.com/fi-alerts
    token_file: /run/secrets/fi-notifications/ntfy-token     # Or token:, or username + password(_file)
    window: { start: "08:00", end: "20:00" }                  # Optional, omit for all day

collars:
  - name: Rex                  # Pet name as shown in the Fi app
    events:
      - type: battery_low
        threshold: 40
        suppress_when_charging: true
        target: phone
        max_per_window: 2      # Optional, omit to send on every matching poll
      - type: collar_offline
        minutes: 60
        target: phone
      - type: lost_mode
        target: phone
