name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml
      - run: uv sync --locked

      - run: uv run just check
